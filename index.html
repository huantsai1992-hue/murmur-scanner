<!-- Index.html v1.5 — GitHub Pages + QuaggaJS 按鈕觸發掃碼版 -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    h2 { text-align: center; margin-bottom: 16px; font-size: 20px; }

    .controls { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .controls label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; margin-top: 12px; }
    .controls label:first-child { margin-top: 0; }
    .controls select {
      width: 100%; padding: 10px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 15px; background: #fafafa;
    }

    .mode-tabs {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .mode-tabs button {
      flex: 1; padding: 10px 4px; border: 2px solid #ddd; border-radius: 8px;
      background: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .mode-tabs button.active {
      border-color: #2563eb; background: #eff6ff; color: #2563eb;
    }

    #reader-container {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      background: #000;
    }
    #reader-container video {
      width: 100%;
      display: block;
    }
    #reader-container canvas.drawingBuffer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .scan-line {
      position: absolute;
      top: 50%;
      left: 5%;
      width: 90%;
      height: 2px;
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .scan-btn {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .scan-btn:active {
      background: #1d4ed8;
      transform: scale(0.98);
    }
    .scan-btn.scanning {
      background: #f59e0b;
      cursor: wait;
    }

    .status-bar {
      background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
    }
    .status-bar .last-result { font-size: 15px; margin-bottom: 8px; }
    .status-bar .count { font-size: 13px; color: #666; }

    .result-success { color: #16a34a; font-weight: 600; }
    .result-error { color: #dc2626; font-weight: 600; }
    .result-loading { color: #2563eb; font-weight: 600; }

    .log {
      background: #fff; border-radius: 12px; padding: 16px;
    }
    .log h3 { font-size: 14px; color: #666; margin-bottom: 8px; }
    .log ul { list-style: none; font-size: 13px; max-height: 200px; overflow-y: auto; }
    .log li { padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
    .log li:last-child { border-bottom: none; }
    .log-success { color: #16a34a; }
    .log-error { color: #dc2626; }

    .location-row { display: none; }
    .location-row.show { display: block; }
  </style>
</head>
<body>

<h2>📦 Murmur 設備掃碼</h2>

<!-- 模式切換 -->
<div class="mode-tabs">
  <button class="active" onclick="setMode('add')">入庫</button>
  <button onclick="setMode('ship')">出貨</button>
  <button onclick="setMode('relocate')">比對入庫</button>
</div>

<!-- 設定 -->
<div class="controls">
  <label>目標 Sheet</label>
  <select id="sheetSelect"><option>載入中...</option></select>

  <div class="location-row show" id="locationRow">
    <label>儲存位置</label>
    <select id="locationSelect">
      <option value="桃園龜山">桃園龜山</option>
      <option value="中鼎大樓">中鼎大樓</option>
    </select>
  </div>
</div>

<!-- 掃碼區 -->
<div id="reader-container">
  <div class="scan-line"></div>
</div>

<!-- 掃碼按鈕 -->
<button id="scanBtn" class="scan-btn" onclick="triggerScan()">📷 點擊掃碼</button>

<!-- 狀態 -->
<div class="status-bar">
  <div class="last-result" id="lastResult">對準條碼後按「點擊掃碼」</div>
  <div class="count">累計掃碼：<span id="scanCount">0</span> 筆</div>
</div>

<!-- 紀錄 -->
<div class="log">
  <h3>掃碼紀錄</h3>
  <ul id="logList"></ul>
</div>

<!-- QuaggaJS (quagga2 maintained fork) -->
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
<script>
  // ====== GAS API 網址 ======
  var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxTFPeR2-iXCk9RiIUMe92vaSTO4ga3xyVE0BF0N2494Y_yitI3NNPxf9JtZee58oXItg/exec';

  var currentMode = 'add';
  var scanCount = 0;
  var lastScannedCode = '';
  var lastScanTime = 0;
  var DEBOUNCE_MS = 3000;
  var ERROR_THRESHOLD = 0.15;
  var quaggaReady = false;
  var isScanning = false;
  var scanTimeout = null;

  // 初始化
  window.onload = function() {
    loadSheetNames();
    initScanner();
  };

  // 載入 Sheet 名稱
  function loadSheetNames() {
    callAPI({ action: 'getSheetNames' })
      .then(function(result) {
        if (result.success) {
          var sel = document.getElementById('sheetSelect');
          sel.innerHTML = '';
          result.data.forEach(function(name) {
            var opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            sel.appendChild(opt);
          });
        }
      })
      .catch(function(err) {
        console.error('載入 Sheet 失敗', err);
      });
  }

  // 模式切換
  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-tabs button').forEach(function(btn) {
      btn.classList.remove('active');
    });
    event.target.classList.add('active');

    var locRow = document.getElementById('locationRow');
    if (mode === 'ship') {
      locRow.classList.remove('show');
    } else {
      locRow.classList.add('show');
    }
  }

  // 初始化掃碼器（只開相機預覽，不掃描）
  function initScanner() {
    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.getElementById('reader-container'),
        constraints: {
          facingMode: "environment",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      },
      decoder: {
        readers: [
          "code_128_reader",
          "ean_reader",
          "ean_8_reader",
          "code_39_reader",
          "upc_reader",
          "upc_e_reader",
          "codabar_reader",
          "i2of5_reader"
        ],
        multiple: false
      },
      locate: true,
      frequency: 15
    }, function(err) {
      if (err) {
        document.getElementById('lastResult').textContent = '相機啟動失敗：' + err.message;
        console.error('Quagga init error:', err);
        return;
      }
      // 啟動相機預覽，然後立刻暫停掃描
      Quagga.start();
      Quagga.pause();
      quaggaReady = true;
    });

    // 偵測到條碼（含信心度過濾）
    Quagga.onDetected(function(result) {
      // 掃到後立刻暫停
      Quagga.pause();
      isScanning = false;
      if (scanTimeout) {
        clearTimeout(scanTimeout);
        scanTimeout = null;
      }
      updateScanBtn(false);

      var code = result.codeResult.code;

      // 信心度過濾
      var errors = result.codeResult.decodedCodes
        .filter(function(d) { return d.error !== undefined; })
        .map(function(d) { return d.error; });
      var avgError = errors.reduce(function(a, b) { return a + b; }, 0) / errors.length;

      console.log('掃描結果:', code, '錯誤率:', avgError.toFixed(4));

      if (avgError > ERROR_THRESHOLD) {
        showResult('辨識不確定（錯誤率 ' + (avgError * 100).toFixed(1) + '%），請重新對準後再按掃碼', 'error');
        return;
      }

      var now = Date.now();
      if (code === lastScannedCode && (now - lastScanTime) < DEBOUNCE_MS) {
        showResult('重複掃碼：' + code + '（' + (DEBOUNCE_MS / 1000) + ' 秒內忽略）', 'error');
        return;
      }
      lastScannedCode = code;
      lastScanTime = now;

      processCode(code);
    });
  }

  // 按鈕觸發掃描
  function triggerScan() {
    if (!quaggaReady) {
      showResult('相機尚未就緒，請稍候', 'error');
      return;
    }
    if (isScanning) {
      return;
    }

    isScanning = true;
    updateScanBtn(true);
    showResult('掃描中... 請對準條碼', 'loading');

    // 恢復掃描
    Quagga.start();

    // 3 秒後如果沒掃到，自動暫停
    scanTimeout = setTimeout(function() {
      Quagga.pause();
      isScanning = false;
      updateScanBtn(false);
      showResult('未偵測到條碼，請調整角度後再按掃碼', 'error');
    }, 3000);
  }

  // 更新按鈕狀態
  function updateScanBtn(scanning) {
    var btn = document.getElementById('scanBtn');
    if (scanning) {
      btn.textContent = '⏳ 掃描中...';
      btn.classList.add('scanning');
    } else {
      btn.textContent = '📷 點擊掃碼';
      btn.classList.remove('scanning');
    }
  }

  // 處理掃碼結果
  function processCode(code) {
    var sheet = document.getElementById('sheetSelect').value;
    var location = document.getElementById('locationSelect').value;

    showResult('處理中...', 'loading');

    var payload;
    if (currentMode === 'add') {
      payload = { action: 'addDevice', sheet: sheet, deviceId: code, location: location };
    } else if (currentMode === 'ship') {
      payload = { action: 'shipDevice', sheet: sheet, deviceId: code };
    } else if (currentMode === 'relocate') {
      payload = { action: 'relocateDevice', sheet: sheet, deviceId: code, location: location };
    }

    callAPI(payload)
      .then(function(result) {
        scanCount++;
        document.getElementById('scanCount').textContent = scanCount;
        var cssClass = result.success ? 'success' : 'error';
        showResult(result.message, cssClass);
        addLog(result.message, cssClass);
      })
      .catch(function(err) {
        showResult('系統錯誤：' + err, 'error');
        addLog('系統錯誤：' + err, 'error');
      });
  }

  // GAS API 呼叫
  function callAPI(payload) {
    var params = new URLSearchParams(payload);
    return fetch(GAS_API_URL + '?' + params.toString())
      .then(function(res) { return res.json(); });
  }

  function showResult(msg, type) {
    var el = document.getElementById('lastResult');
    el.textContent = msg;
    el.className = 'last-result result-' + type;
  }

  function addLog(msg, type) {
    var li = document.createElement('li');
    li.className = 'log-' + type;
    var time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
    li.textContent = time + ' ' + msg;
    var list = document.getElementById('logList');
    list.insertBefore(li, list.firstChild);
  }
</script>

</body>
</html>
